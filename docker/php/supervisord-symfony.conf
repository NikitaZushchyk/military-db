[supervisord]
nodaemon=true
logfile=/var/www/var/log/supervisord.log
pidfile=/tmp/supervisord.pid
user=laravel

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/www/var/log/php-fpm.err.log
stdout_logfile=/var/www/var/log/php-fpm.out.log

[program:symfony-worker]
command=php /var/www/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/var/log/worker.log